<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title></title>
        <script src="link_dialog.js"></script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                min-width: 520px;
            }
            body {
                padding: 12px;
            }
            h1 {
                font-size: 1.05em;
                margin: 0 0 8px 0;
                font-weight: 600;
            }
            #destination {
                word-break: break-all;
                white-space: pre-wrap;
                background: rgba(127, 127, 127, 0.12);
                border: 1px solid rgba(127, 127, 127, 0.35);
                border-radius: 4px;
                padding: 8px 10px;
                margin: 0 0 14px 0;
                max-height: 140px;
                overflow-y: auto;
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 0.85em;
                user-select: text;
            }
            #actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
            }
            button {
                padding: 6px 14px;
                font-size: 1em;
                cursor: pointer;
                border: 1px solid rgba(127, 127, 127, 0.5);
                border-radius: 3px;
                background: ButtonFace;
                color: ButtonText;
            }
            button:focus {
                outline: 2px solid Highlight;
                outline-offset: 1px;
            }
            #action_open {
                font-weight: 600;
            }
        </style>
    </head>

    <body>
        <h1 id="prompt"></h1>
        <div id="destination" aria-live="polite"></div>
        <div id="actions">
            <button id="action_cancel" data="cancel"></button>
            <button id="action_analyse" data="analyse"></button>
            <button id="action_open" data="open"></button>
        </div>
    </body>
</html>
