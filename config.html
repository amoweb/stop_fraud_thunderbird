<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

	<head>
		<title>Config</title>
		<script src="config.js"></script>
	</head>

	<body>
		<div style="padding: 10px;">
			<label for="providerList">Provider:</label><br />
			<select id="providerList" style="width: 100%; margin-top: 5px;">
				<option value="anthropic">anthropic</option>
				<option value="deepseek">deepseek</option>
				<option value="google">google</option>
				<option value="groq">groq</option>
				<option value="lms">lms</option>
				<option value="mistral">mistral</option>
				<option value="ollama">ollama</option>
				<option value="openai">openai</option>
				<option value="xai">xai</option>
			</select>
			<br /><br />
			<label for="apiKey">API Key:</label><br />
			<input type="text" id="apiKey" style="width: 100%; margin-top: 5px;" />
			<br /><br />
			<label for="modelName">Model Name:</label><br />
			<input type="text" id="modelName" style="width: 100%; margin-top: 5px;" />
			<br /><br />
			<button id="save">Save</button>
		</div>
	</body>

</html>
