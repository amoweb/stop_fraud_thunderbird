<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

	<head>
		<title>Config</title>
		<script src="config.js"></script>
	</head>

	<body>
		<div style="padding: 10px;">
			<label for="providerList" id="providerLabel">Provider:</label><br />
			<select id="providerList" style="width: 100%; margin-top: 5px;">
				<option value="anthropic">anthropic</option>
				<option value="deepseek">deepseek</option>
				<option value="google">google</option>
				<option value="groq">groq</option>
                <option value="openai-compatible">OpenAI compatible (Lyceum, Scaleway, OVH, local)</option>
				<option value="mistral">mistral</option>
				<option value="ollama">ollama</option>
				<option value="openai">openai</option>
				<option value="xai">xai</option>
			</select>
			<br /><br />
			<label for="apiKey" id="apiKeyLabel">API Key:</label><br />
			<input type="text" id="apiKey" style="width: 100%; margin-top: 5px;" />
			<br /><br />
			<label for="modelName" id="modelNameLabel">Model Name:</label><br />
			<input type="text" id="modelName" style="width: 100%; margin-top: 5px;" />
			<br /><br />
			<label for="baseURL" id="baseURLLabel">Base URL:</label><br />
			<input type="text" id="baseURL" placeholder="http://localhost:1234/v1" style="width: 100%; margin-top: 5px;" />
			<br /><br />
			<label><input type="checkbox" id="interceptLinks" /> <span id="interceptLinksLabel"></span></label>
			<br /><br />
			<button id="save">Save</button>
		</div>
	</body>

</html>
